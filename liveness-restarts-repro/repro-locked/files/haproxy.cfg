global
    maxconn 20000
    stats socket /tmp/haproxy.sock

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend fe_http
    bind *:8080
    default_backend be_local

frontend fe_tls
    bind *:8443 ssl crt /usr/local/etc/haproxy/tls.pem
    default_backend be_local

# haproxy itself serves /healthz on 1936 (like the real router's health
# endpoint) — this container is the probed victim, the kill target.
listen healthz
    bind *:1936
    mode http
    monitor-uri /healthz

# passthrough scenario: L4 only — haproxy shovels bytes, the client's TLS
# handshake terminates at the backend (tls-backend container, same cert).
# haproxy's CPU profile here is the cheap end of the ingress-perf swing.
frontend fe_pt
    bind *:8444
    mode tcp
    default_backend be_pt

backend be_local
    server local 127.0.0.1:2936 check

backend be_pt
    mode tcp
    server tls-be 127.0.0.1:2937
